[project]
name = "subitoo"
version = "0.1.0"
description = "Modular multi-site marketplace scraper with scheduled queries and notifications"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "curl_cffi>=0.7",
    "croniter>=2.0",
]

[project.optional-dependencies]
# The app only needs to CONNECT to the remote Camoufox server, so it needs just
# Playwright (no camoufox/browser binaries). This pin MUST match browser/Dockerfile's
# playwright pin and be compatible with the installed Camoufox. See the "Browser:
# Camoufox <-> Playwright version pin" section in SPEC.md before changing it.
browser = ["playwright==1.53.0"]
dev = ["pytest>=8.2"]

[project.scripts]
subitoo = "subitoo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subitoo"]
artifacts = ["subitoo/migrations/*.sql"]

[tool.pytest.ini_options]
markers = [
    "live: hits real sites/network; skipped unless --live is passed",
]
testpaths = ["tests"]
